<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E9EEE8">
  <link rel="icon" href="data:,">
  <title>Sunrise Reveal — étude ROOMRESET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Figtree:wght@400..800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Figtree:wght@400..800&display=swap"></noscript>
  <link rel="stylesheet" href="css/rr.css">
  <style>
    .wrap { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) var(--gutter) calc(env(safe-area-inset-bottom) + 24px); }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .top a { color: var(--text-2); font-weight: 600; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
    h1 { font-size: clamp(38px, 11vw, 52px); margin: 0 0 8px; }
    .lead { margin: 0 0 18px; color: var(--text-2); }
    .frame {
      position: relative; margin: 0; overflow: hidden; border-radius: 22px; aspect-ratio: 3 / 4; max-height: 62dvh;
      touch-action: none; cursor: ew-resize; user-select: none; -webkit-user-select: none; background: var(--card);
      box-shadow: 0 0 0 1px rgb(var(--shade) / 0.08), calc(var(--lx) * 4px) calc(var(--ly) * 8px) 22px -10px rgb(var(--shade) / 0.45);
    }
    .zoom, .win, .focus { position: absolute; inset: 0; }
    .zoom { will-change: transform; }
    .win { overflow: hidden; will-change: transform; }
    .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; }
    .win .photo { will-change: transform; }
    .focus canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; will-change: opacity; }
    .band { position: absolute; top: 0; bottom: 0; left: 0; width: 72px; pointer-events: none; will-change: transform; }
    .band:focus-visible { outline: none; }
    .band:focus-visible .core { box-shadow: 0 0 0 3px var(--light-ink), 0 0 14px 4px rgb(255 214 140 / 0.8); }
    .band .glow { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgb(255 220 150 / 0.38) 50%, transparent); }
    .band .streak { position: absolute; top: 0; bottom: 0; right: 50%; width: 170px; opacity: 0.15; background: linear-gradient(90deg, transparent, rgb(255 238 196 / 0.42)); will-change: opacity; }
    .band .core { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; transform: translateX(-50%); background: linear-gradient(#FFF8EA, #FFE1A0); box-shadow: 0 0 14px 4px rgb(255 214 140 / 0.75); border-radius: 2px; }
    .tag { position: absolute; top: 12px; padding: 6px 11px; border-radius: var(--r-pill); background: var(--card); color: var(--text); font: 650 13px/1 var(--font-ui); box-shadow: 0 2px 8px -2px rgb(var(--shade) / 0.3); pointer-events: none; }
    .tag-after { left: 12px; } .tag-before { right: 12px; }
    .hint { margin: 12px 2px 0; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .summary { margin-top: 16px; padding: 16px 18px; will-change: transform, opacity; }
    .summary p { margin: 0; }
    .summary strong { font-family: var(--font-display); font-size: 20px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top" id="tools"><a href="index.html">Planche</a></div>
    <h1 class="display">Le jour entre</h1>
    <p class="lead">Faites glisser la lumière sur la photo pour comparer avant et après.</p>
    <figure class="frame" id="frame">
      <div class="zoom" id="zoom">
        <img class="photo" id="beforeImg" src="assets/room-before.jpg" alt="La chambre avant le Reset" width="1080" height="1440" draggable="false">
        <div class="win" id="win"><img class="photo" id="afterImg" src="assets/room-after.jpg" alt="La chambre après le Reset" width="1080" height="1440" draggable="false"></div>
        <div class="focus" id="focus" hidden aria-hidden="true"></div>
      </div>
      <div class="band" id="band" role="slider" tabindex="0" aria-label="Lumière : comparer avant et après" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" aria-valuetext="Glissez pour comparer">
        <span class="glow"></span><span class="streak" id="streak"></span><span class="core"></span>
      </div>
      <span class="tag tag-after" aria-hidden="true">Après</span>
      <span class="tag tag-before" aria-hidden="true">Avant</span>
    </figure>
    <p class="hint muted small" id="hint" hidden>Glissez n’importe où sur la photo. Au clavier : flèches gauche et droite.</p>
    <div class="actions">
      <button class="btn btn-primary" id="showAfter" type="button">Montrer l’après</button>
      <button class="btn btn-quiet" id="replay" type="button">Rejouer</button>
    </div>
    <div class="summary card" id="summary" hidden role="status">
      <p><strong>La lumière est entrée.</strong>Cinq missions placées en dix minutes. Images d’exemple rendues dans Blender, même cadrage et même lumière.</p>
    </div>
  </main>
  <script type="module" src="js/reveal.js"></script>
</body>
</html>
